plugins {
    id 'multiloader-loader'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
def releaseJar = tasks.named('remapJar')

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn(releaseJar)
    group = 'publishing'
    apiToken = rootProject.ext.curseforgeKey
    def mainFile = upload(curseforge_project_id, releaseJar.flatMap { it.archiveFile })
    mainFile.releaseType = 'release'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.ext.releaseChangelog
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('Fabric')
    mainFile.addRequirement('fabric-api')
}

modrinth {
    token = rootProject.ext.modrinthKey
    projectId = modrinth_project_id
    versionNumber = "${minecraft_version}-${project.version}"
    versionName = "${project.version} for Fabric ${minecraft_version}"
    versionType = 'release'
    uploadFile = releaseJar
    gameVersions = [minecraft_version]
    changelog = rootProject.ext.releaseChangelog
    loaders = ['fabric']
    dependencies { required.project 'fabric-api' }
}
